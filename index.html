<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4구역 신호등</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f2f5ff;font-family:system-ui,sans-serif}header{padding:22px;background:#172438}h1{margin:0;font-size:26px}small{color:#a8bdd2}#clock{font-size:22px;float:right}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:16px}.panel{background:#19273b;border:1px solid #35475f;border-radius:18px;padding:22px}h2{margin-top:0}.stage{display:flex;align-items:center;justify-content:center;gap:40px;margin:20px 0}.signal{background:linear-gradient(90deg,#12161c,#29313b,#11161c);border:7px solid #414b57;border-radius:25px;padding:12px;display:grid;gap:10px;box-shadow:8px 12px 20px #0006}.lamp{width:72px;height:72px;border-radius:50%;background:#242a32;border:5px solid #090c12;box-shadow:inset 0 6px 13px #000b}.red.on{background:#ff3a45;box-shadow:0 0 24px #f44550aa}.green.on{background:#30eb81;box-shadow:0 0 24px #30eb81aa}.yellow.on{background:#ffcd35;box-shadow:0 0 24px #ffcd35aa}.status{font-weight:bold;font-size:22px}.count{font-size:32px;font-variant-numeric:tabular-nums}.note,footer{color:#b1c0d4;font-size:13px;line-height:1.7}footer{padding:8px 24px 24px}@media(max-width:650px){.grid{grid-template-columns:1fr}.stage{gap:22px}#clock{float:none}}
</style><header><span id="clock"></span><h1>교통신호 관측 대시보드</h1><small>4개 구역 · 160초 주기 가정 · 한국 표준시</small></header><main class="grid" id="grid"></main><footer>※ 관측 자료를 바탕으로 한 시뮬레이션입니다. 제1 신호등 이외의 지속시간 및 모든 반복주기는 검증되지 않았습니다. 황색 지속시간은 미상으로 표시하지 않습니다. 실제 도로 횡단 판단에 사용하지 마십시오.</footer><script>
const data=[['제1','07:35:15','07:33:20 꺼짐 · 07:35:15 켜짐 · 07:36:00 꺼짐'],['제2','07:37:50','07:37:50 켜짐'],['제3','07:39:55','07:39:55 켜짐'],['제4','07:37:15','07:37:15 켜짐']];
const grid=document.querySelector('#grid');grid.innerHTML=data.map((s,i)=>'<section class="panel"><h2>'+s[0]+' 신호등</h2><small>기준 점등 '+s[1]+'</small><div class="stage"><div class="signal"><div class="lamp red" id="r'+i+'"></div><div class="lamp yellow"></div><div class="lamp green" id="g'+i+'"></div></div><div><div class="status" id="s'+i+'"></div><small id="l'+i+'"></small><div class="count" id="c'+i+'"></div></div></div><div class="note">관측: '+s[2]+'<p>녹색 45초 / 적색 115초 (가정 포함)</p></div></section>').join('');
function tick(){const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(new Date());document.querySelector('#clock').textContent=parts+' KST';const t=parts.split(':').reduce((a,b)=>a*60+Number(b),0);data.forEach((d,i)=>{const base=d[1].split(':').reduce((a,b)=>a*60+Number(b),0);const p=((t-base)%160+160)%160;const green=p<45;const left=green?45-p:160-p;document.querySelector('#r'+i).classList.toggle('on',!green);document.querySelector('#g'+i).classList.toggle('on',green);document.querySelector('#s'+i).textContent=green?'녹색 점등':'적색 점등';document.querySelector('#s'+i).style.color=green?'#65f1a3':'#ff777b';document.querySelector('#l'+i).textContent=green?'적색 전환까지':'녹색 전환까지';document.querySelector('#c'+i).textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')})}tick();setInterval(tick,500);
</script></html>
